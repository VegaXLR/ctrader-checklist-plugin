<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>cTrader Checklist</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="plugin-shell">
        <section id="checklistCard" class="checklist-card">
            <header class="plugin-header">
                <div class="title-row">
                    <h1>cTrader Checklist</h1>

                    <div id="progressCounter" class="progress-counter">
                        0/0
                    </div>
                </div>

                <div id="readyStatus" class="ready-status">
                    ✓ Checklist complete
                </div>

                <div class="list-controls">
                    <select id="checklistSelect" class="checklist-select" title="Select checklist"></select>

                    <button id="newChecklistButton" class="header-icon-button" type="button"
                        title="Create checklist from template">
                        +
                    </button>

                    <button id="renameChecklistButton" class="header-icon-button" type="button"
                        title="Rename selected checklist">
                        ✎
                    </button>

                    <button id="duplicateChecklistButton" class="header-icon-button" type="button"
                        title="Duplicate selected checklist">
                        ⧉
                    </button>

                    <button id="exportButton" class="header-icon-button" type="button" title="Export all checklists">
                        ⇩
                    </button>

                    <button id="importButton" class="header-icon-button" type="button" title="Import checklists">
                        ⇧
                    </button>

                    <button id="deleteChecklistButton" class="header-icon-button danger" type="button"
                        title="Delete selected checklist">
                        ×
                    </button>

                    <input id="importFileInput" type="file" accept="application/json,.json" hidden />
                </div>

                <div class="bulk-actions">
                    <button id="tickAllButton" class="bulk-button" type="button"
                        title="Tick all items in this checklist">
                        ✓ Tick all
                    </button>

                    <button id="untickAllButton" class="bulk-button" type="button"
                        title="Untick all items in this checklist">
                        □ Untick all
                    </button>
                </div>
            </header>

            <section class="list-wrapper">
                <div id="checklistItems" class="checklist-items"></div>
            </section>

            <footer class="plugin-footer">
                <a href="https://ctraderltd.pxf.io/ZVLLWR" target="_blank" rel="noopener noreferrer">
                    Made by VegaXLR
                </a>
            </footer>
        </section>
    </main>

    <section id="itemModal" class="modal-backdrop" aria-hidden="true">
        <div class="modal">
            <h2 id="modalTitle">Add checklist item</h2>

            <input id="itemInput" type="text" maxlength="160" placeholder="Type your checklist item..." />

            <label class="optional-toggle">
                <input id="optionalItemInput" type="checkbox" />
                <span>Optional item</span>
            </label>

            <div class="modal-actions">
                <button id="cancelItemModalButton" class="modal-button secondary" type="button">
                    Cancel
                </button>

                <button id="saveItemButton" class="modal-button primary" type="button">
                    Save
                </button>
            </div>
        </div>
    </section>

    <section id="checklistModal" class="modal-backdrop" aria-hidden="true">
        <div class="modal">
            <h2 id="checklistModalTitle">Rename checklist</h2>

            <input id="checklistNameInput" type="text" maxlength="60" placeholder="Checklist name..." />

            <div class="modal-actions">
                <button id="cancelChecklistModalButton" class="modal-button secondary" type="button">
                    Cancel
                </button>

                <button id="saveChecklistButton" class="modal-button primary" type="button">
                    Save
                </button>
            </div>
        </div>
    </section>

    <section id="templateModal" class="modal-backdrop" aria-hidden="true">
        <div class="modal">
            <h2>Create checklist</h2>

            <select id="templateSelect" class="modal-select"></select>

            <input id="templateNameInput" type="text" maxlength="60" placeholder="Checklist name..."
                class="template-name-input" />

            <div class="template-preview" id="templatePreview"></div>

            <div class="modal-actions">
                <button id="cancelTemplateModalButton" class="modal-button secondary" type="button">
                    Cancel
                </button>

                <button id="createFromTemplateButton" class="modal-button primary" type="button">
                    Create
                </button>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>

</html>
