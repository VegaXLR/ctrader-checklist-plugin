<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>cTrader Checklist</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="plugin-shell">
        <section class="checklist-card">
            <header class="plugin-header">
                <div class="title-row">
                    <h1>cTrader Checklist</h1>
                </div>

                <div class="list-controls">
                    <select id="checklistSelect" class="checklist-select" title="Select checklist"></select>

                    <button id="newChecklistButton" class="header-icon-button" type="button"
                        title="Create new checklist">
                        +
                    </button>

                    <button id="deleteChecklistButton" class="header-icon-button danger" type="button"
                        title="Delete selected checklist">
                        ×
                    </button>
                </div>
            </header>

            <section class="list-wrapper">
                <div id="checklistItems" class="checklist-items"></div>
            </section>

            <section class="add-section">
                <button id="addItemButton" class="add-button" type="button">
                    + Add new item
                </button>
            </section>

            <footer class="plugin-footer">
                <a href="https://ctraderltd.pxf.io/ZVLLWR" target="_blank" rel="noopener noreferrer">
                    Made by VegaXLR
                </a>
            </footer>
        </section>
    </main>

    <section id="itemModal" class="modal-backdrop" aria-hidden="true">
        <div class="modal">
            <h2 id="modalTitle">Add checklist item</h2>

            <input id="itemInput" type="text" maxlength="160" placeholder="Type your checklist item..." />

            <div class="modal-actions">
                <button id="cancelItemModalButton" class="modal-button secondary" type="button">
                    Cancel
                </button>

                <button id="saveItemButton" class="modal-button primary" type="button">
                    Save
                </button>
            </div>
        </div>
    </section>

    <section id="checklistModal" class="modal-backdrop" aria-hidden="true">
        <div class="modal">
            <h2>Create new checklist</h2>

            <input id="checklistNameInput" type="text" maxlength="60" placeholder="Checklist name..." />

            <div class="modal-actions">
                <button id="cancelChecklistModalButton" class="modal-button secondary" type="button">
                    Cancel
                </button>

                <button id="saveChecklistButton" class="modal-button primary" type="button">
                    Create
                </button>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>

</html>
